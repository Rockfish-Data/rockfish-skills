name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate every skills/*/SKILL.md
        run: python scripts/check_skills.py

  smoke:
    name: generate-from-data smoke test
    runs-on: ubuntu-latest
    # Only the offline examples run here. Examples 3 and 4 train real models on a
    # Rockfish backend, which needs credentials and a GPU; they stay a manual
    # pre-release step.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the Rockfish SDK
        run: |
          pip install --find-links https://packages.rockfish.ai \
            'rockfish[labs]' pandas numpy pyarrow
      - name: Report the installed SDK version
        run: python -c "from importlib import metadata; print('rockfish', metadata.version('rockfish'))"
      - name: Offline examples (profile + recommend, report card)
        run: python skills/generate-from-data/reference/train-generate.py -e 1 -e 2
